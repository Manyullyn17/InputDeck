[workspace]
resolver = "3"
members = ["engine", "tools/deckcfg", "app/src-tauri"]
# The desktop app needs webkit/GTK; plain `cargo test`/`build` skips it.
default-members = ["engine", "tools/deckcfg"]
# Firmware is its own workspace: it only builds for the RP2040 target.
exclude = ["firmware"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
