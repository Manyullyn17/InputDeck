[package]
name = "mpcfg"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
macropad-engine = { version = "0.1.0", path = "../../engine" }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
