# Macropad OS demo config: the meta layer example from the design discussion.
#
# Check:   cargo run -p mpcfg -- check configs/demo.toml
# Encode:  cargo run -p mpcfg -- encode configs/demo.toml -o demo.bin
#
# Bindings (case-insensitive):
#   _                 inherit from the parent layer (or nothing on base)
#   none              nothing
#   layer:<id>        hold for that layer
#   toggle:<id>       toggle that layer on/off
#   latch:<action>    hold the action down until pressed again
#   repeat:<action>@<ms>  tap the action every <ms> until pressed again (default 100)
#   macro:<id>        run a macro (see [macros] at the bottom)
#   settings          open the onboard settings menu
#   profile:next, profile:prev   switch between uploaded profiles
#   profile:2                    jump to a specific profile (its position on the device)
#   bootloader        reboot into the firmware bootloader
#   a, 7, f5, enter, esc, space, tab, backspace, up, left, home, pgup, -, [, ...
#   ctrl+c, shift+alt+t, gui+space, rctrl+x   keys with modifiers
#   vol+, vol-, mute, play, next, prev, stop  media keys
#   mouse:left, mouse:right, mouse:middle, mouse:back, mouse:forward, mouse:6 .. mouse:16  mouse buttons
#   scroll:up, scroll:down:3, scroll:left, scroll:right  scroll (optional notch count)
#   0x2c, media:0xb5  raw HID usages
#
# Colors: "#rrggbb", "off", or "_" (inherit).
#
# Several files can be uploaded as profiles:
#   cargo run -p mpcfg -- upload configs/demo.toml configs/numpad.toml

# Profile name, shown when switching profiles.
name = "Demo"

# The computer's keyboard layout, used to type text in macros:
#   "us", "de"        built in
#   "xkb:eu"          any XKB layout from /usr/share/X11/xkb/symbols (eu = EurKEY),
#                     with an optional variant: "xkb:de(nodeadkeys)"
#   "system"          the active desktop layout (KDE)
# Single characters can be added or overridden:
#   [layout]
#   base = "us"
#   chars = { "€" = "ralt+5", "é" = ["ralt+0x34", "e"] }   # key or key sequence
layout = "us"

[timing]
tap = 8             # ms a tapped/typed key is held down
char_delay = 8      # ms between typed characters

[leds]
brightness = 60     # percent
idle_level = 45     # percent of held brightness
held_style = "brighten"   # brighten | white | invert
# Global category colors (unset ones keep the built-in defaults).
palette = { layer_key = "#005aff", key = "#ff963c", modified = "#aa00ff", media = "#00ff46", macro = "#ffd200", unbound = "off" }

[idle]
dim_after = 60      # seconds, 0 = never
off_after = 600

# Keys that show a color while a lock is on: caps_lock, num_lock, scroll_lock.
[indicators]
caps_lock = { key = 12, color = "#ffffff" }

# Layer-independent actions, used wherever a layer leaves the key on "_".
# Keys are numbered 1-12 from the top-left; "encoder" is the knob button.
[global]
# 12 = "mute"

# The layer with id "base" is layer 0. Other layers default to parent = "base".
[layers.base]
name = "Base"
keys = [
  "layer:one", "layer:two", "a",
  "b",         "c",         "d",
  "e",         "f",         "g",
  "h",         "i",         "j",
]
encoder = { cw = "vol+", ccw = "vol-", press = "toggle:tools" }
colors = { 12 = { idle = "#ff0000", held = "#ffdc00" } }

[layers.one]
name = "One"
keys = [
  "_", "layer:three", "1",
  "_", "_",           "_",
  "_", "_",           "_",
  "_", "_",           "_",
]
encoder = { cw = "right", ccw = "left" }
palette = { key = "#00ffb4" }

[layers.two]
name = "Two"
keys = [
  "layer:four", "_", "2",
  "_",          "_", "_",
  "_",          "_", "_",
  "_",          "_", "_",
]
palette = { key = "#ff288c" }

[layers.three]
name = "Three"
parent = "one"
keys = [
  "_", "_", "3",
  "_", "_", "_",
  "_", "_", "_",
  "_", "_", "_",
]

[layers.four]
name = "Four"
parent = "two"
keys = [
  "_", "_", "4",
  "_", "_", "_",
  "_", "_", "_",
  "_", "_", "_",
]

# Toggled with the knob button. Press the knob again to leave.
[layers.tools]
name = "Tools"
keys = [
  "macro:hello",  "macro:ticker",       "latch:shift",
  "repeat:b@250", "macro:word_skip",    "macro:shout",
  "settings",     "_",                  "profile:next",
  "_",            "_",                  "_",
]
encoder = { cw = "vol+", ccw = "vol-" }
palette = { key = "#ff4000" }
colors = { 2 = { active = "#00ff00" } }

# Macros. Steps: "down:<action>", "up:<action>", "tap:<action>" (or just
# "<action>"), "delay:<ms>", "text:<text>".
# type: "once" (default), "while_held", "toggle". Toggle macros also take
# stop = "finish" (default, completes the current run) or "immediate".

[macros.hello]
name = "Hello"
steps = ["text:Hello from Macropad OS!", "enter"]

[macros.ticker]
name = "Tick"
type = "toggle"
steps = ["text:tick ", "delay:500"]

[macros.word_skip]
name = "Words"
type = "while_held"
steps = ["ctrl+right", "delay:120"]   # jump word by word while held

[macros.shout]
name = "Shout"
steps = ["down:shift", "text:abc", "up:shift", "text: (typed with shift held, still lowercase)"]
