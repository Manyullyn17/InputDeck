[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-graphics = "0.8.2"
heapless = "0.8"
macropad-engine = { version = "0.1.0", path = "../engine" }
panic-halt = "1.0.0"
usbd-hid = "0.10.2"

[workspace]

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
opt-level = 1
